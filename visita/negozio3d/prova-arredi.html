<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova arredi 3D</title>
<style>
  :root { --sfondo: #2a221b; --testo: #f4ead8; }
  html, body { margin: 0; height: 100%; background: var(--sfondo); color: var(--testo); font-family: system-ui, sans-serif; overflow: hidden; }
  #barra { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; background: rgba(20,15,10,.75); font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; z-index: 2; }
  #barra a, #barra button { color: var(--testo); background: #5a3b24; border: 0; border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; text-decoration: none; }
  #barra button.att { background: #b5462c; }
  #info { position: fixed; bottom: 8px; left: 12px; font-size: 12px; opacity: .8; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="barra">
  <a href="../../index.html">☰ Menu</a>
  <strong>Arredi veri del negozio</strong>
  <span id="tasti"></span>
</div>
<div id="info">Trascina per girare · rotella per lo zoom · clic su un nome per andarci</div>
<script src="../../vendor/three/three-bundle.js"></script>
<script>
// tex.js e' facoltativo (lo fa un altro agente): se manca, arredi.js usa i materiali di ripiego
(function () {
  function carica(src, poi) { var s = document.createElement('script'); s.src = src; s.onload = poi; s.onerror = poi; document.head.appendChild(s); }
  var usaTex = !/[?&]notex/.test(location.search);
  (usaTex ? function (f) { carica('tex.js', f); } : function (f) { f(); })(function () { carica('arredi.js', avvia); });
})();

function avvia() {
  var THREE = window.THREE, A = window.ARREDI;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a221b);
  var pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.45;
  var cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.02, 100);
  var ctr = new THREE.OrbitControls(cam, renderer.domElement); ctr.enableDamping = true;

  // luce calda
  scene.add(new THREE.HemisphereLight(0xfff0d8, 0x4a3420, 0.9));
  var sole = new THREE.DirectionalLight(0xffe2b8, 2.0); sole.position.set(4, 6, -5); sole.castShadow = true;
  sole.shadow.mapSize.set(2048, 2048); var sc = sole.shadow.camera; sc.left = -18; sc.right = 18; sc.top = 6; sc.bottom = -6; sc.far = 30; sole.shadow.bias = -0.0005;
  scene.add(sole); scene.add(sole.target); sole.target.position.set(8, 0, 0);
  var pav;
  var mP = (window.TEX && TEX.parquet) ? TEX.parquet() : new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.6 });
  pav = new THREE.Mesh(new THREE.PlaneGeometry(40, 8), mP); pav.rotation.x = -Math.PI / 2; pav.position.set(8, 0, -1.5); pav.receiveShadow = true; scene.add(pav);
  var muro = new THREE.Mesh(new THREE.PlaneGeometry(40, 3.2), new THREE.MeshStandardMaterial({ color: 0xf1ede6, roughness: 0.9 }));
  muro.position.set(8, 1.6, 0.0); muro.rotation.y = Math.PI; muro.receiveShadow = true; scene.add(muro);

  // arredi in fila (fronte verso -z, la camera guarda da -z)
  var fila = [
    ['vetrinaParete', { quota: 1.0 }, 1.25], ['mobileBasso', {}, 1.75], ['bancone', { l2: 0.8 }, 2.2], ['scaffaleLibreria', {}, 1.15],
    ['totemRayBan', {}, 0.8], ['colonnaRotante', {}, 0.5], ['mensoleOcchialiParete', {}, 1.45], ['sedia', {}, 0.65],
    ['specchioOvale', {}, 0.45], ['schermoVerticale', {}, 0.8], ['climatizzatore', {}, 1.0], ['registratoreCassa', {}, 0.45],
    ['quadro', { cornice: 'radica' }, 0.65], ['poster', {}, 0.75], ['porta', {}, 1.1], ['tappeto', {}, 1.0], ['occhiale', { s: 3 }, 0.6],
    ['faretto', {}, 0.3], ['tuboLed', {}, 1.3], ['telecamera', {}, 0.4]
  ];
  var x = 0, posti = [], tasti = document.getElementById('tasti');
  fila.forEach(function (f) {
    var g;
    try { g = A[f[0]](f[1]); } catch (e) { console.error('errore ' + f[0], e); return; }
    var cx = x + f[2] / 2;
    g.position.x = cx;
    if (f[0] === 'climatizzatore' || f[0] === 'telecamera') g.position.y = 2.0;
    if (f[0] === 'quadro' || f[0] === 'poster') g.position.y = 1.2;
    if (f[0] === 'faretto' || f[0] === 'tuboLed') { g.position.y = 2.6; g.position.z = -0.6; }
    if (f[0] === 'colonnaRotante' || f[0] === 'specchioOvale' || f[0] === 'registratoreCassa') {
      var piedi = A.mobileBasso({ w: f[2] - 0.05, h: 0.9, d: 0.45, colonne: 1, cassetti: 3 }); piedi.position.x = cx; scene.add(piedi); g.position.y = 0.9; g.position.z = -0.03;
    }
    if (f[0] === 'occhiale') g.position.set(cx, 1.0, -0.3);
    scene.add(g);
    posti.push({ nome: f[0], x: cx, g: g });
    var b = document.createElement('button'); b.textContent = f[0];
    b.onclick = function () { vai(f[0]); }; tasti.appendChild(b);
    x += f[2] + 0.25;
  });
  var tot = x;
  function vai(nome) {
    var p = posti.filter(function (q) { return q.nome === nome; })[0];
    var bb = new THREE.Box3().setFromObject(p.g), c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
    var dist = Math.max(s.x, s.y) * 1.35 + 0.4;
    ctr.target.copy(c); cam.position.set(c.x + dist * 0.25, c.y + dist * 0.12, c.z - dist);
    [].forEach.call(tasti.children, function (b) { b.classList.toggle('att', b.textContent === nome); });
  }
  window.vai = vai;
  window.vista = function (px, py, pz, tx, ty, tz) { cam.position.set(px, py, pz); ctr.target.set(tx, ty, tz); };
  vista(tot / 2, 2.2, -9, tot / 2, 1.0, 0);
  var m = /[?&]vai=(\w+)/.exec(location.search); if (m) vai(m[1]);
  function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize);
  var t0 = performance.now(), nf = 0;
  (function loop() {
    requestAnimationFrame(loop);
    var t = performance.now();
    posti.forEach(function (p) { if (p.g.userData.parteRotante) p.g.userData.parteRotante.rotation.y = (t - t0) / 4000; });
    ctr.update(); renderer.render(scene, cam); nf++;
    if (nf === 3) window.__pronto = true;
  })();
  window.__info = function () { return renderer.info.render; };
}
</script>
</body>
</html>
