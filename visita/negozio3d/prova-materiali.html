<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova materiali</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a221c; color: #f3ead9; font: 14px system-ui, sans-serif; }
  #barra { position: fixed; top: 0; left: 0; right: 0; padding: 8px 14px; background: rgba(0,0,0,.45); z-index: 2; }
  #barra a { color: #f3c37a; }
  canvas { display: block; }
  #err { color: #ff8a7a; }
</style>
</head>
<body>
<div id="barra"><a href="../../index.html">☰ Menu</a> · Prova dei materiali del negozio (tex.js) · trascina per girare <span id="err"></span></div>
<script src="../../vendor/three/three-bundle.js"></script>
<script src="tex.js"></script>
<script>
(function () {
  var THREE = window.THREE;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a221c);
  var pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.55;
  var cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
  cam.position.set(0, 2.2, 9.5);
  var ctr = new THREE.OrbitControls(cam, renderer.domElement); ctr.target.set(0, 1.1, 0); ctr.update();
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x5a4030, 0.6));
  var sole = new THREE.DirectionalLight(0xffe2b8, 1.6); sole.position.set(3, 6, 5); scene.add(sole);

  var voci = [];
  TEX.elenco().forEach(function (k) {
    if (k === "da" || k === "poster") return;
    try { voci.push([k, TEX[k]({ dim: [1, 1] })]); } catch (e) { console.error(k, e); }
  });
  var scena = /scena/.test(location.search);
  var cols = 6, sx = 1.45, sy = 1.9;
  var sfondo = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), TEX.intonaco({ dim: [12, 8] }));
  sfondo.position.set(0, 1.5, -1.2); scene.add(sfondo);
  if (scena) costruisciScena(); else voci.forEach(function (v, i) {
    var c = i % cols, r = Math.floor(i / cols);
    var x = (c - (cols - 1) / 2) * sx, y = 3.2 - r * sy;
    var pan = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.04), v[1]); pan.position.set(x - 0.0, y, -0.6); scene.add(pan);
    var sf = new THREE.Mesh(new THREE.SphereGeometry(0.28, 48, 32), v[1]); sf.position.set(x + 0.35, y - 0.35, 0); scene.add(sf);
    var cv = document.createElement("canvas"); cv.width = 256; cv.height = 48; var g = cv.getContext("2d");
    g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, 0, 256, 48); g.fillStyle = "#fff"; g.font = "26px sans-serif"; g.fillText(v[0], 10, 33);
    var t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
    var et = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.19), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));
    et.position.set(x, y - 0.66, -0.55); scene.add(et);
  });
  function box(w, h, d, m, x, y, z) { var o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); scene.add(o); return o; }
  function costruisciScena() {
    // angolo del negozio: parquet, pannello ocra basso + intonaco, vetrinetta in radica, bancone
    sfondo.visible = false;
    var pav = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), TEX.parquet({ dim: [6, 5] })); pav.rotation.x = -Math.PI / 2; scene.add(pav);
    box(6, 1.1, 0.05, TEX.ocra({ dim: [6, 1.1] }), 0, 0.55, -2.5);
    box(6, 1.9, 0.05, TEX.intonaco({ dim: [6, 1.9] }), 0, 2.05, -2.5);
    box(1.4, 1.5, 0.45, TEX.radica({ dim: [1.4, 1.5] }), -1.2, 1.85, -2.25);
    box(1.1, 1.3, 0.04, TEX.ocra({ dim: [1.1, 1.3] }), -1.2, 1.85, -2.0);
    box(1.2, 0.012, 0.35, TEX.vetroScaffale(), -1.2, 1.9, -2.1);
    box(2.6, 0.95, 0.6, TEX.banconeFronte({ dim: [2.6, 0.95] }), 0.8, 0.475, -0.6);
    box(2.7, 0.03, 0.7, TEX.bancone({ dim: [2.7, 0.7] }), 0.8, 0.965, -0.6);
    box(2.7, 0.012, 0.012, TEX.banconeBordo(), 0.8, 0.95, -0.25);
    for (var i = 0; i < 4; i++) { var an = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.007, 12, 24), TEX.ottone()); an.position.set(0.2, 0.25 + i * 0.18, -0.295); scene.add(an); }
    box(0.45, 0.06, 0.45, TEX.plasticaBlu(), 2.4, 0.47, 0.6);
    box(0.45, 0.45, 0.05, TEX.plasticaBlu(), 2.4, 0.75, 0.82);
    box(0.5, 1.9, 0.25, TEX.metalloTotem(), 2.4, 0.95, -2.2);
    box(0.4, 1.0, 0.02, TEX.pannelloTotem(), 2.4, 1.3, -2.07);
    cam.position.set(0, 1.6, 4.2); ctr.target.set(0, 1, -1); ctr.update();
  }
  window.__voci = voci.map(function (v) { return v[0]; });
  function loop() { renderer.render(scene, cam); requestAnimationFrame(loop); }
  loop();
  addEventListener("resize", function () { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  window.__pronto = true;
})();
</script>
</body>
</html>
